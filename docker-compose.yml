services:
  midwestcam:
    build: .
    container_name: midwestcam
    restart: unless-stopped
    ports:
      - "4011:4011"
    environment:
      - DATABASE_URL=postgres://trevor@postgres:5432/midwestcam
      - STORAGE_PATH=/data/photos
      - THUMB_PATH=/data/thumbs
      - BASE_URL=https://midwestcam.thomasduke.io
      - MAX_UPLOAD_MB=50
      - PORT=4011
    volumes:
      - photo-data:/data
    networks:
      - postgres-net

volumes:
  photo-data:
    driver: local

networks:
  postgres-net:
    external: true
    name: postgres_default
